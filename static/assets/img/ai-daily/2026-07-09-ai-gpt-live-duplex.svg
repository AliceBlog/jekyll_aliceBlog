<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#172554"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1030" cy="95" r="180" fill="#38bdf8" opacity=".12"/>
  <circle cx="130" cy="590" r="210" fill="#c084fc" opacity=".12"/>
  <text x="70" y="95" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="42" font-weight="700">GPT‑Live：全双工语音 AI</text>
  <text x="72" y="137" fill="#93c5fd" font-family="Arial, sans-serif" font-size="22">边听、边说、边把复杂任务丢给后台模型</text>
  <g transform="translate(90 230)">
    <rect x="0" y="0" width="260" height="170" rx="30" fill="#111827" stroke="#67e8f9" stroke-width="3"/>
    <text x="130" y="72" fill="#fff" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">人</text>
    <text x="130" y="112" fill="#93c5fd" text-anchor="middle" font-family="Arial" font-size="18">说话 / 停顿 / 打断</text>
  </g>
  <g transform="translate(465 205)" filter="url(#glow)">
    <rect x="0" y="0" width="270" height="220" rx="38" fill="url(#a)" opacity=".95"/>
    <text x="135" y="78" fill="#07111f" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800">GPT‑Live</text>
    <text x="135" y="118" fill="#111827" text-anchor="middle" font-family="Arial" font-size="18">连续交互层</text>
    <text x="135" y="152" fill="#111827" text-anchor="middle" font-family="Arial" font-size="17">每秒多次决定：</text>
    <text x="135" y="180" fill="#111827" text-anchor="middle" font-family="Arial" font-size="17">听 / 说 / 等 / 调工具</text>
  </g>
  <g transform="translate(850 230)">
    <rect x="0" y="0" width="260" height="170" rx="30" fill="#111827" stroke="#a78bfa" stroke-width="3"/>
    <text x="130" y="68" fill="#fff" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">后台模型</text>
    <text x="130" y="108" fill="#c4b5fd" text-anchor="middle" font-family="Arial" font-size="18">搜索 / 推理 / Agent任务</text>
  </g>
  <path d="M355 285 C405 235 425 235 465 285" fill="none" stroke="#67e8f9" stroke-width="8" marker-end="url(#m)"/>
  <path d="M465 345 C420 395 400 395 350 345" fill="none" stroke="#67e8f9" stroke-width="8" opacity=".75"/>
  <path d="M735 285 C790 230 815 230 850 285" fill="none" stroke="#c084fc" stroke-width="8"/>
  <path d="M850 345 C800 405 780 405 735 345" fill="none" stroke="#c084fc" stroke-width="8" opacity=".75"/>
  <text x="600" y="525" fill="#e0e7ff" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">重点不是“会说话”，而是“对话不中断，复杂事后台做”。</text>
  <text x="600" y="565" fill="#bfdbfe" text-anchor="middle" font-family="Arial" font-size="18">一个面向语音 Agent 的新分层：交互层保持节奏，智能层负责深活。</text>
</svg>
