<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="70" y="80" fill="#e0f2fe" font-family="Arial" font-size="38" font-weight="800">语音 Agent 的新分层</text>
  <text x="72" y="122" fill="#93c5fd" font-family="Arial" font-size="22">前台负责“别冷场”，后台负责“把事办成”</text>
  <g font-family="Arial">
    <rect x="110" y="190" width="980" height="96" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/><text x="145" y="247" fill="#fff" font-size="30" font-weight="700">1. 语音感知层</text><text x="500" y="247" fill="#bae6fd" font-size="22">听声音、分辨停顿、抗噪、捕捉打断</text>
    <rect x="110" y="310" width="980" height="96" rx="24" fill="url(#card)" opacity=".92"/><text x="145" y="367" fill="#07111f" font-size="30" font-weight="800">2. 连续交互层</text><text x="500" y="367" fill="#111827" font-size="22">决定说不说、等不等、追不追问、何时交棒</text>
    <rect x="110" y="430" width="980" height="96" rx="24" fill="#111827" stroke="#a78bfa" stroke-width="3"/><text x="145" y="487" fill="#fff" font-size="30" font-weight="700">3. 深度任务层</text><text x="500" y="487" fill="#ddd6fe" font-size="22">搜索、推理、工具调用、长任务 Agent 执行</text>
  </g>
  <text x="600" y="590" text-anchor="middle" fill="#dbeafe" font-family="Arial" font-size="24" font-weight="700">真正的产品体验，藏在“交互层”和“任务层”的边界设计里。</text>
</svg>
