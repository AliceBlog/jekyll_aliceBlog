<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>超可爱煎饼动画 Kawaii 设计稿</title>
  <script src="https://cdn.staticfile.org/jquery/3.2.1/jquery.min.js"></script>
  <script src="/assets/js/TweenMax.min.js"></script>
  <style>
    :root {
      --cream: #fff8ee;
      --milk: #fffdf8;
      --pink: #ff8fb8;
      --pink-soft: #ffe1ed;
      --pink-deep: #ff5f9d;
      --blue: #8ac7ff;
      --blue-deep: #5aaef8;
      --lavender: #d9c7ff;
      --mint: #bff5df;
      --ink: #5a4050;
      --muted: #9c7989;
      --cake-raw: #fff0a8;
      --cake-gold: #ffc96b;
      --cake-toast: #e9904a;
      --syrup: #b86c3e;
      --syrup-dark: #874321;
      --cheek: #ff8fab;
      --butter: #fff072;
      --pan-pink: #ff9fbd;
      --pan-inner: #fff0f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 16% 18%, rgba(255,143,184,.28), transparent 18rem),
        radial-gradient(circle at 86% 14%, rgba(138,199,255,.28), transparent 22rem),
        radial-gradient(circle at 68% 88%, rgba(191,245,223,.35), transparent 20rem),
        linear-gradient(135deg, #fff8ee 0%, #fff1f7 44%, #eff8ff 100%);
      overflow-x: hidden;
    }
    .kawaii-stage {
      width: min(1040px, calc(100vw - 28px));
      min-height: 660px;
      position: relative;
      padding: 42px;
      border-radius: 44px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,250,252,.72)),
        repeating-radial-gradient(circle at 0 0, rgba(255,143,184,.08) 0 4px, transparent 5px 26px);
      border: 2px solid rgba(255,143,184,.22);
      box-shadow: 0 32px 110px rgba(255, 95, 157, .18), 0 16px 52px rgba(90, 174, 248, .12);
      backdrop-filter: blur(20px);
    }
    .kawaii-stage:before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 34px;
      border: 2px dashed rgba(255,143,184,.28);
      pointer-events: none;
    }
    .copy {
      position: relative;
      z-index: 10;
      max-width: 430px;
      padding-top: 18px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--blue));
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 12px 28px rgba(255,95,157,.22);
    }
    h1 {
      margin: 20px 0 12px;
      font-size: clamp(38px, 6vw, 70px);
      line-height: .96;
      letter-spacing: -.075em;
      color: #664458;
      text-shadow: 0 4px 0 rgba(255,255,255,.75);
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.85;
      font-size: 16px;
    }
    .cute-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }
    .cute-btn {
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 18px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink-deep), var(--pink));
      font-weight: 900;
      box-shadow: 0 14px 32px rgba(255,95,157,.26);
    }
    .cute-note {
      display: inline-flex;
      align-items: center;
      padding: 12px 16px;
      border-radius: 999px;
      color: var(--pink-deep);
      background: rgba(255,225,237,.76);
      border: 1px solid rgba(255,143,184,.25);
      font-weight: 800;
    }
    .motion-field {
      position: absolute;
      right: 70px;
      top: 52px;
      width: 500px;
      height: 545px;
    }
    .plate-glow {
      position: absolute;
      left: 72px;
      top: 292px;
      width: 360px;
      height: 116px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,143,184,.22), rgba(138,199,255,.11) 58%, transparent 70%);
      filter: blur(6px);
      animation: glowPulse 3.6s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%,100% { transform: scale(.96); opacity: .7; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    .decor {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 8px 12px rgba(255,95,157,.12));
      animation: floaty 4s ease-in-out infinite;
    }
    .decor.heart1 { right: 46px; top: 72px; font-size: 34px; animation-delay: -.4s; }
    .decor.heart2 { right: 352px; top: 246px; font-size: 24px; animation-delay: -1.4s; }
    .decor.star1 { right: 392px; top: 98px; font-size: 30px; animation-delay: -2.1s; }
    .decor.star2 { right: 18px; top: 312px; font-size: 22px; animation-delay: -2.8s; }
    .decor.bow { right: 120px; top: 12px; font-size: 42px; animation-delay: -1s; }
    @keyframes floaty {
      0%,100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-14px) rotate(7deg); }
    }
    .steam {
      position: absolute;
      width: 16px;
      height: 72px;
      border-radius: 999px;
      background: linear-gradient(180deg, transparent, rgba(255,143,184,.34), rgba(138,199,255,.26), transparent);
      filter: blur(.4px);
      opacity: .7;
      animation: softSteam 3.2s ease-in-out infinite;
    }
    .steam.s1 { left: 150px; top: 62px; animation-delay: -.2s; }
    .steam.s2 { left: 248px; top: 34px; height: 86px; animation-delay: -1.1s; }
    .steam.s3 { left: 340px; top: 70px; animation-delay: -2s; }
    @keyframes softSteam {
      0%,100% { transform: translateY(8px) scale(.72); opacity: .15; }
      45% { transform: translateY(-20px) scale(1.08); opacity: .75; }
    }

    .pan {
      cursor: pointer;
      width: 340px;
      position: absolute;
      top: 322px;
      left: 244px;
      z-index: 2;
      transform-origin: 170px 247px;
      margin-left: -170px;
      margin-top: -247px;
      transform: rotate(45deg);
      filter: drop-shadow(0 28px 30px rgba(255,95,157,.22));
    }
    .pancake__wrapper {
      cursor: pointer;
      width: 190px;
      height: 190px;
      position: absolute;
      top: 322px;
      left: 244px;
      z-index: 5;
      margin-left: -95px;
      margin-top: -95px;
      transform: rotate(45deg);
      transform-style: preserve-3d;
      backface-visibility: hidden;
      filter: drop-shadow(0 20px 18px rgba(181,96,42,.22));
    }
    .pancake__wrapper:before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 48% 52% 50% 50% / 52% 48% 52% 48%;
      background: var(--cake-raw);
      border: 9px solid rgba(255,255,255,.72);
      box-shadow:
        inset 0 -18px 30px rgba(198, 112, 53, .16),
        inset 0 14px 22px rgba(255,255,255,.56),
        0 0 0 10px rgba(255,225,237,.34);
      transform: rotateX(180deg);
      animation: kawaiiCook 60s forwards ease, squishy 3.8s ease-in-out infinite;
    }
    .pancake {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      transform: rotate(-45deg) translate3d(0, 0, 5px);
      overflow: visible;
    }
    .pancake__head { animation: kawaiiCookFill 60s forwards ease; }
    .pancake__splodge { animation: syrupBounce 3.2s ease-in-out infinite; transform-origin: center; }
    .pancake__face { display: none; }
    .pancake__face--smiling { display: block; }
    .pancake--cooking .pancake__face--smiling { display: none; }
    .pancake--cooking .pancake__face--cooking { display: block; }
    .pancake--flipping .pancake__face--smiling,
    .pancake--flipping .pancake__face--cooking { display: none; }
    .pancake--flipping .pancake__face--flipping { display: block; }
    @keyframes kawaiiCook {
      0% { background: var(--cake-raw); }
      50% { background: var(--cake-gold); }
      100% { background: var(--cake-toast); }
    }
    @keyframes kawaiiCookFill {
      0% { fill: #fff2a8; }
      50% { fill: #ffc96b; }
      100% { fill: #e9904a; }
    }
    @keyframes syrupBounce {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(2px) scale(1.015); }
    }
    @keyframes squishy {
      0%,100% { border-radius: 48% 52% 50% 50% / 52% 48% 52% 48%; }
      50% { border-radius: 52% 48% 53% 47% / 48% 54% 46% 52%; }
    }

    @media (max-width: 860px) {
      body { overflow: auto; }
      .kawaii-stage { min-height: 860px; padding: 30px 24px; }
      .motion-field { right: 50%; top: 350px; transform: translateX(50%) scale(.78); }
    }
  </style>
</head>
<body>
  <main class="kawaii-stage">
    <section class="copy">
      <span class="badge">🎀 Pancake Kawaii Redesign</span>
      <h1>软乎乎，甜甜的煎饼酱。</h1>
      <p>这版走更明显的女生审美：奶油底色、粉蓝糖果色、蝴蝶结、爱心、圆脸腮红、bling bling 小装饰。动效仍然沿用原来的点击翻锅逻辑。</p>
      <div class="cute-actions">
        <button class="cute-btn" type="button" onclick="document.querySelector('.pancake__wrapper').click()">戳一下翻锅 💕</button>
        <span class="cute-note">保留 cook / flip 表情状态</span>
      </div>
    </section>

    <section class="motion-field" aria-label="超可爱煎饼动画设计稿">
      <div class="plate-glow"></div>
      <span class="decor heart1">💖</span>
      <span class="decor heart2">💕</span>
      <span class="decor star1">✨</span>
      <span class="decor star2">✦</span>
      <span class="decor bow">🎀</span>
      <span class="steam s1"></span><span class="steam s2"></span><span class="steam s3"></span>

      <div class="pancake__wrapper">
        <svg class="pancake" viewBox="0 0 220 220" aria-label="超可爱煎饼">
          <defs>
            <radialGradient id="cakeBase" cx="34%" cy="24%" r="74%">
              <stop offset="0" stop-color="#fff9c9"/>
              <stop offset=".56" stop-color="#ffd377"/>
              <stop offset="1" stop-color="#f3a251"/>
            </radialGradient>
            <linearGradient id="kawaiiSyrup" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#cf814b"/>
              <stop offset="1" stop-color="#8b4424"/>
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#9d5731" flood-opacity=".18"/>
            </filter>
          </defs>
          <path class="pancake__head" filter="url(#softShadow)" fill="url(#cakeBase)" d="M109 17c51 0 92 38 92 89 0 54-40 96-92 96-53 0-91-42-91-94 0-51 40-91 91-91z"/>
          <path d="M54 76c6-20 24-35 45-41" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity=".45"/>
          <circle cx="57" cy="135" r="8" fill="#b96b32" opacity=".12"/>
          <circle cx="162" cy="148" r="10" fill="#b96b32" opacity=".13"/>
          <circle cx="144" cy="54" r="6" fill="#fff" opacity=".36"/>
          <path class="pancake__splodge" fill="url(#kawaiiSyrup)" d="M82 52c18-15 56-14 68 5 7 12-7 23-1 35 6 14 27 15 22 33-5 17-30 11-41 22-11 10-5 31-25 33-19 1-22-23-36-28-15-5-34 6-43-11-9-18 13-30 15-47 2-19-12-32 4-45 12-10 24 9 37 3z"/>
          <path d="M74 51c10-6 26-8 39-5" fill="none" stroke="#e7a169" stroke-width="7" stroke-linecap="round" opacity=".55"/>
          <rect x="92" y="38" width="40" height="31" rx="10" fill="#fff06f" transform="rotate(-8 112 53)"/>
          <path d="M99 48h20" stroke="#fff8aa" stroke-width="4" stroke-linecap="round" opacity=".8"/>
          <path d="M70 143c-16 16-35 16-47 5" fill="none" stroke="#e59458" stroke-width="8" stroke-linecap="round" opacity=".62"/>
          <path d="M150 143c16 16 35 16 47 5" fill="none" stroke="#e59458" stroke-width="8" stroke-linecap="round" opacity=".62"/>
          <path d="M176 70c6-10 18-4 14 7-3 9-18 14-18 14s-8-15-4-22c2-4 6-4 8 1z" fill="#ff8fb8" opacity=".88"/>
          <path d="M42 62c3-8 13-7 15 1 2-8 13-7 15 1 3 13-15 23-15 23S39 75 42 62z" fill="#ffd4e5" opacity=".92"/>

          <g class="pancake__face pancake__face--smiling">
            <path d="M75 101c0-8 6-14 14-14s14 6 14 14" fill="none" stroke="#5a4050" stroke-width="7" stroke-linecap="round"/>
            <path d="M123 101c0-8 6-14 14-14s14 6 14 14" fill="none" stroke="#5a4050" stroke-width="7" stroke-linecap="round"/>
            <ellipse cx="67" cy="124" rx="15" ry="10" fill="#ff8fab" opacity=".72"/>
            <ellipse cx="154" cy="124" rx="15" ry="10" fill="#ff8fab" opacity=".72"/>
            <path d="M91 126c9 12 29 12 38 0" fill="none" stroke="#5a4050" stroke-width="7" stroke-linecap="round"/>
            <path d="M107 119c2 3 5 3 7 0" fill="none" stroke="#5a4050" stroke-width="5" stroke-linecap="round"/>
          </g>
          <g class="pancake__face pancake__face--cooking">
            <circle cx="88" cy="98" r="8" fill="#5a4050"/>
            <circle cx="134" cy="98" r="8" fill="#5a4050"/>
            <circle cx="85" cy="95" r="3" fill="#fff"/>
            <circle cx="131" cy="95" r="3" fill="#fff"/>
            <ellipse cx="66" cy="124" rx="16" ry="11" fill="#ff7fa7" opacity=".82"/>
            <ellipse cx="156" cy="124" rx="16" ry="11" fill="#ff7fa7" opacity=".82"/>
            <path d="M95 125c8 8 24 8 32 0" fill="none" stroke="#5a4050" stroke-width="7" stroke-linecap="round"/>
            <path d="M162 42c9-13-8-19 2-33" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="6" stroke-linecap="round"/>
          </g>
          <g class="pancake__face pancake__face--flipping">
            <circle cx="111" cy="126" r="15" fill="#5a4050"/>
            <path d="M75 91l22 12-22 9" fill="none" stroke="#5a4050" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M147 91l-22 12 22 9" fill="none" stroke="#5a4050" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <ellipse cx="64" cy="128" rx="13" ry="9" fill="#ff8fab" opacity=".7"/>
            <ellipse cx="158" cy="128" rx="13" ry="9" fill="#ff8fab" opacity=".7"/>
            <path d="M102 135h18" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
          </g>
        </svg>
      </div>

      <svg class="pan" viewBox="0 0 340 390" aria-label="粉色可爱平底锅">
        <defs>
          <linearGradient id="handlePink" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#ffb9d0"/>
            <stop offset="1" stop-color="#ff72a9"/>
          </linearGradient>
          <radialGradient id="panPinkInner" cx="42%" cy="36%" r="72%">
            <stop offset="0" stop-color="#fff8fb"/>
            <stop offset=".68" stop-color="#ffd9e8"/>
            <stop offset="1" stop-color="#ff9fbd"/>
          </radialGradient>
        </defs>
        <rect x="149" y="14" width="42" height="154" rx="21" fill="url(#handlePink)"/>
        <circle cx="170" cy="48" r="10" fill="#fff" opacity=".8"/>
        <path d="M140 144h60v45h-60z" fill="#ffc2d8"/>
        <circle cx="170" cy="254" r="133" fill="#ff8fb8"/>
        <circle cx="170" cy="254" r="112" fill="#fff" opacity=".72"/>
        <circle cx="170" cy="254" r="98" fill="url(#panPinkInner)"/>
        <ellipse cx="132" cy="215" rx="42" ry="19" fill="#fff" opacity=".56" transform="rotate(-24 132 215)"/>
        <path d="M119 278c23 24 79 24 102 0" fill="none" stroke="#ff79ad" stroke-width="10" stroke-linecap="round" opacity=".38"/>
        <circle cx="170" cy="254" r="23" fill="#ff6b9c" opacity=".9"/>
        <path d="M164 250c4-7 13-7 17 0 4-7 17-4 17 7 0 14-28 26-28 26s-28-12-28-26c0-11 13-14 17-7z" fill="#fff" opacity=".94"/>
        <circle cx="118" cy="186" r="7" fill="#fff" opacity=".65"/>
        <circle cx="237" cy="226" r="5" fill="#fff" opacity=".58"/>
      </svg>
    </section>
  </main>
  <script src="/assets/js/jianbing.js"></script>
</body>
</html>
