<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alice 分层数字人路线 C V1.1 精修原型</title>
  <style>
    :root { color-scheme: light; --blue:#007aff; --ink:#1f2a44; --muted:#66758f; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background: radial-gradient(circle at 18% 12%, rgba(255,206,229,.52), transparent 28rem), radial-gradient(circle at 82% 10%, rgba(0,122,255,.18), transparent 30rem), linear-gradient(180deg,#f8fbff,#fff); }
    .page { max-width:1120px; margin:0 auto; padding:36px 24px 72px; display:grid; grid-template-columns:minmax(0,1fr)420px; gap:28px; align-items:center; }
    .copy { padding:28px; border-radius:32px; background:rgba(255,255,255,.72); border:1px solid rgba(0,122,255,.1); box-shadow:0 22px 80px rgba(31,65,114,.09); backdrop-filter:blur(18px); }
    .eyebrow { display:inline-flex; padding:8px 12px; border-radius:999px; background:#eef6ff; color:#0067d9; font-weight:800; font-size:13px; }
    h1 { margin:18px 0 12px; font-size:clamp(34px,5vw,64px); line-height:1; letter-spacing:-.06em; }
    p { color:var(--muted); line-height:1.8; font-size:16px; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
    button { border:0; padding:12px 16px; border-radius:16px; background:#fff; color:#0067d9; font-weight:800; cursor:pointer; box-shadow:0 12px 26px rgba(0,122,255,.11); }
    button.primary { background:linear-gradient(135deg,#007aff,#55b5ff); color:#fff; }
    .stage-card { position:relative; min-height:720px; display:grid; place-items:center; border-radius:36px; overflow:hidden; background:linear-gradient(180deg,rgba(255,255,255,.52),rgba(236,246,255,.72)); border:1px solid rgba(0,122,255,.1); box-shadow:0 28px 90px rgba(31,65,114,.12); }
    .stage-card:before { content:""; position:absolute; inset:10%; border-radius:50%; background:radial-gradient(circle, rgba(0,122,255,.18), transparent 62%); filter:blur(28px); transform:scale(calc(.92 + var(--alice-energy,0) * .28)); opacity:calc(.35 + var(--alice-energy,0) * .45); }
    .alice-layered-avatar { position:relative; width:min(360px,82vw); aspect-ratio:9/16; cursor:pointer; user-select:none; --alice-energy:0; }
    .alice-layered-avatar__stage { position:absolute; inset:0; transform-origin:50% 70%; transition:filter .25s ease; }
    .alice-layered-avatar__layer { position:absolute; object-fit:contain; pointer-events:none; will-change:transform,opacity; transform:translateZ(0); }
    .alice-layered-avatar__bubble { position:absolute; right:78%; top:16%; z-index:120; min-width:180px; max-width:260px; padding:12px 15px; border-radius:18px 18px 5px 18px; color:#265b92; background:rgba(255,255,255,.94); border:1px solid rgba(100,160,230,.2); box-shadow:0 18px 42px rgba(31,65,114,.16); opacity:0; transform:translate(10px,10px) scale(.94); transform-origin:100% 100%; transition:.22s ease; font-weight:750; line-height:1.5; }
    .alice-layered-avatar.is-bubble-visible .alice-layered-avatar__bubble { opacity:1; transform:translate(0,0) scale(1); }
    .alice-layered-avatar__bubble:after { content:""; position:absolute; right:12px; bottom:-6px; width:12px; height:12px; background:rgba(255,255,255,.94); border-right:1px solid rgba(100,160,230,.2); border-bottom:1px solid rgba(100,160,230,.2); transform:rotate(45deg); }
    .alice-layered-avatar[data-state="thinking"] .alice-layered-avatar__stage { filter:drop-shadow(0 0 20px rgba(255,205,87,.35)); }
    .alice-layered-avatar[data-state="speaking"] .alice-layered-avatar__stage { filter:drop-shadow(0 0 24px rgba(75,190,255,.48)); }
    .layer-04_left_arm, .layer-05_right_arm, .layer-11_bow { transition:transform .08s linear; }
    .notes { margin-top:18px; padding:16px 18px; border-radius:20px; background:#fff8e9; color:#7a4b14; font-size:14px; line-height:1.7; }
    @media (max-width:900px){ .page{grid-template-columns:1fr}.stage-card{min-height:620px}.alice-layered-avatar__bubble{right:auto;left:4%;top:4%;transform-origin:0 100%} }
  </style>
</head>
<body>
  <main class="page">
    <section class="copy">
      <span class="eyebrow">路线 C · V1.1 精修分层数字人</span>
      <h1>Alice 进入可精修的分层角色形态。</h1>
      <p>V1.1 在视频角色一致性的基础上，自动补绘隐藏区域、清理手臂/头发/帽子/蝴蝶结边缘，并新增眼皮层与 closed/A/E/O 嘴型。</p>
      <div class="actions">
        <button class="primary" onclick="AliceLayeredAvatar && AliceLayeredAvatar.greet()">打招呼</button>
        <button onclick="AliceLayeredAvatar && AliceLayeredAvatar.think('我在认真思考怎么帮你～')">思考</button>
        <button onclick="AliceLayeredAvatar && AliceLayeredAvatar.speak('主人，我现在是分层动画形态，可以做嘴型和表情了。')">说话</button>
        <button onclick="AliceLayeredAvatar && AliceLayeredAvatar.listen()">聆听</button>
        <button onclick="AliceLayeredAvatar && AliceLayeredAvatar.happy()">开心</button>
      </div>
      <div class="notes">说明：这是 V1.1 自动精修版，已经补了隐藏区域和嘴型/眼皮层；但仍属于程序化补绘，正式上线前还可以继续用生成式 inpainting 做更细腻的发丝、衣褶和边缘清理。</div>
    </section>
    <section class="stage-card">
      <div class="alice-layered-avatar" data-alice-layered-avatar data-manifest="/assets/img/alice-avatar-layers/manifest-v11.json" data-state="idle">
        <div class="alice-layered-avatar__stage"></div>
        <div class="alice-layered-avatar__bubble">我在这里，有事喊我～</div>
      </div>
    </section>
  </main>
  <script src="/assets/js/alice-layered-avatar.js?v=20260706-2"></script>
</body>
</html>
