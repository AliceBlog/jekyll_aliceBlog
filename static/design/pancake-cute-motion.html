<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>可爱煎饼动画重构设计稿</title>
  <script src="https://cdn.staticfile.org/jquery/3.2.1/jquery.min.js"></script>
  <script src="/assets/js/TweenMax.min.js"></script>
  <style>
    :root {
      --blue: #007aff;
      --blue-soft: #e8f3ff;
      --ink: #1d2433;
      --muted: #697386;
      --pan: #243044;
      --pan-inner: #111827;
      --pan-rim: #e8ecf1;
      --pancake-raw: #fff2a4;
      --pancake-gold: #f1b95c;
      --pancake-toast: #c96a34;
      --butter: #ffe56d;
      --cheek: #ff9ab5;
      --syrup: #a95a2b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 72% 20%, rgba(255,242,164,.58), transparent 20rem),
        radial-gradient(circle at 18% 28%, rgba(0,122,255,.16), transparent 25rem),
        linear-gradient(180deg, #f8fbff 0%, #fff 58%, #f3f8ff 100%);
      overflow: hidden;
    }
    .stage {
      width: min(960px, calc(100vw - 32px));
      min-height: 620px;
      position: relative;
      border-radius: 38px;
      padding: 38px;
      overflow: hidden;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(0,122,255,.12);
      box-shadow: 0 28px 100px rgba(31,65,114,.12);
      backdrop-filter: blur(18px);
    }
    .stage:before {
      content: "";
      position: absolute;
      inset: 30px;
      border-radius: 30px;
      border: 1px dashed rgba(0,122,255,.18);
      pointer-events: none;
    }
    .copy {
      position: relative;
      z-index: 5;
      max-width: 420px;
    }
    .pill {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
    }
    h1 {
      margin: 18px 0 12px;
      font-size: clamp(34px, 6vw, 62px);
      line-height: 1;
      letter-spacing: -.07em;
    }
    p { margin: 0; color: var(--muted); line-height: 1.85; }
    .hint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      padding: 12px 16px;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), #37a2ff);
      font-weight: 800;
      box-shadow: 0 16px 36px rgba(0,122,255,.22);
    }
    .motion-field {
      position: absolute;
      right: 92px;
      top: 78px;
      width: 420px;
      height: 430px;
      transform: rotate(-3deg);
    }
    .steam {
      position: absolute;
      width: 10px;
      height: 58px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(0,122,255,0), rgba(0,122,255,.22), rgba(0,122,255,0));
      filter: blur(.2px);
      animation: steam 3.2s ease-in-out infinite;
      opacity: .8;
    }
    .steam.s1 { left: 96px; top: 24px; animation-delay: -.2s; }
    .steam.s2 { left: 186px; top: 6px; height: 72px; animation-delay: -1.1s; }
    .steam.s3 { left: 274px; top: 30px; animation-delay: -2s; }
    @keyframes steam {
      0%,100% { transform: translateY(10px) scale(.72); opacity: .18; }
      45% { transform: translateY(-18px) scale(1.08); opacity: .78; }
    }

    .pan {
      cursor: pointer;
      width: 300px;
      position: absolute;
      top: 278px;
      left: 210px;
      z-index: 2;
      transform-origin: 150px 224px;
      margin-left: -150px;
      margin-top: -224px;
      transform: rotate(45deg);
      filter: drop-shadow(0 28px 28px rgba(29,36,51,.18));
    }
    .pancake__wrapper {
      cursor: pointer;
      width: 166px;
      height: 166px;
      position: absolute;
      top: 278px;
      left: 210px;
      z-index: 4;
      margin-left: -83px;
      margin-top: -83px;
      transform: rotate(45deg);
      transform-style: preserve-3d;
      backface-visibility: hidden;
      filter: drop-shadow(0 18px 18px rgba(129,74,20,.18));
    }
    .pancake__wrapper:before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 999px;
      background: var(--pancake-raw);
      border: 8px solid rgba(255,255,255,.56);
      box-shadow: inset 0 -16px 28px rgba(184,101,37,.16), inset 0 12px 18px rgba(255,255,255,.44);
      transform: rotateX(180deg);
      animation: cuteCook 60s forwards ease;
    }
    .pancake {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      transform: rotate(-45deg) translate3d(0, 0, 5px);
      overflow: visible;
    }
    .pancake__head { animation: cuteCookFill 60s forwards ease; }
    .pancake__splodge { animation: syrupWiggle 3.6s ease-in-out infinite; }
    .pancake__face { display: none; }
    .pancake__face--smiling { display: block; }
    .pancake--cooking .pancake__face--smiling { display: none; }
    .pancake--cooking .pancake__face--cooking { display: block; }
    .pancake--flipping .pancake__face--smiling,
    .pancake--flipping .pancake__face--cooking { display: none; }
    .pancake--flipping .pancake__face--flipping { display: block; }
    @keyframes cuteCook {
      0% { background: var(--pancake-raw); }
      50% { background: var(--pancake-gold); }
      100% { background: var(--pancake-toast); }
    }
    @keyframes cuteCookFill {
      0% { fill: var(--pancake-raw); }
      50% { fill: var(--pancake-gold); }
      100% { fill: var(--pancake-toast); }
    }
    @keyframes syrupWiggle {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(2px); }
    }
    .sparkle {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 0 0 5px rgba(255,255,255,.24);
      animation: sparkle 2.8s ease-in-out infinite;
    }
    .sparkle.a { right: 70px; top: 106px; }
    .sparkle.b { right: 340px; top: 274px; transform: scale(.72); animation-delay: -1s; }
    .sparkle.c { right: 26px; top: 312px; transform: scale(.55); animation-delay: -1.8s; }
    @keyframes sparkle { 0%,100% { opacity:.18; transform: rotate(0deg) scale(.65); } 45% { opacity:1; transform: rotate(45deg) scale(1); } }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .stage { min-height: 760px; padding: 26px; }
      .motion-field { right: 50%; top: 318px; transform: translateX(50%) scale(.78) rotate(-3deg); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="copy">
      <span class="pill">🥞 Cute Pancake Motion Draft</span>
      <h1>把煎饼做得更可爱。</h1>
      <p>保留原来的点击翻锅动效和三种表情状态：微笑、加热、翻面。视觉上改成更圆润的煎饼、软乎乎的糖浆、高光、腮红、小爱心锅铲感。</p>
      <button class="hint" type="button" onclick="document.querySelector('.pancake__wrapper').click()">点我试试翻锅 →</button>
    </section>

    <section class="motion-field" aria-label="新版煎饼动画设计稿">
      <span class="steam s1"></span><span class="steam s2"></span><span class="steam s3"></span>
      <span class="sparkle a"></span><span class="sparkle b"></span><span class="sparkle c"></span>

      <div class="pancake__wrapper">
        <svg class="pancake" viewBox="0 0 180 180" aria-label="可爱煎饼">
          <defs>
            <radialGradient id="cuteCakeGlow" cx="34%" cy="24%" r="72%">
              <stop offset="0" stop-color="#fff8c8"/>
              <stop offset="0.58" stop-color="#ffd66f"/>
              <stop offset="1" stop-color="#f0a247"/>
            </radialGradient>
            <linearGradient id="syrup" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#c47739"/>
              <stop offset="1" stop-color="#8e431f"/>
            </linearGradient>
          </defs>
          <circle class="pancake__head" cx="90" cy="90" r="76" fill="url(#cuteCakeGlow)"/>
          <circle cx="62" cy="52" r="13" fill="rgba(255,255,255,.38)"/>
          <circle cx="122" cy="134" r="8" fill="rgba(158,82,28,.16)"/>
          <circle cx="47" cy="119" r="6" fill="rgba(158,82,28,.13)"/>
          <path class="pancake__splodge" fill="url(#syrup)" opacity=".92" d="M70 38c13-11 45-12 55 4 7 11-7 20-2 31 5 12 23 14 18 29-4 14-24 9-33 18-10 9-5 27-22 29-16 1-18-19-30-24-12-4-28 5-35-9-8-15 10-25 12-39 2-16-10-27 3-38 10-9 23 7 34-1z"/>
          <rect x="72" y="28" width="34" height="26" rx="8" fill="var(--butter)" transform="rotate(-8 89 41)"/>
          <path d="M58 118c-17 11-29 9-38 1" fill="none" stroke="#d58a4a" stroke-width="7" stroke-linecap="round" opacity=".72"/>
          <path d="M122 118c17 11 29 9 38 1" fill="none" stroke="#d58a4a" stroke-width="7" stroke-linecap="round" opacity=".72"/>

          <g class="pancake__face pancake__face--smiling">
            <circle cx="65" cy="84" r="7" fill="#1f2937"/>
            <circle cx="115" cy="84" r="7" fill="#1f2937"/>
            <circle cx="62" cy="82" r="2" fill="#fff"/>
            <circle cx="112" cy="82" r="2" fill="#fff"/>
            <circle cx="52" cy="101" r="9" fill="var(--cheek)" opacity=".72"/>
            <circle cx="128" cy="101" r="9" fill="var(--cheek)" opacity=".72"/>
            <path d="M72 103c8 12 28 12 36 0" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
          </g>
          <g class="pancake__face pancake__face--cooking">
            <path d="M58 82c5-7 13-7 18 0" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
            <path d="M104 82c5-7 13-7 18 0" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
            <circle cx="52" cy="101" r="10" fill="var(--cheek)" opacity=".82"/>
            <circle cx="128" cy="101" r="10" fill="var(--cheek)" opacity=".82"/>
            <path d="M75 104c6 8 24 8 30 0" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
            <path d="M132 44c9-12-6-18 2-29" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="5" stroke-linecap="round"/>
          </g>
          <g class="pancake__face pancake__face--flipping">
            <circle cx="90" cy="103" r="13" fill="#1f2937"/>
            <path d="M58 80l18 10-18 7" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M122 80l-18 10 18 7" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="50" cy="106" r="8" fill="var(--cheek)" opacity=".65"/>
            <circle cx="130" cy="106" r="8" fill="var(--cheek)" opacity=".65"/>
          </g>
        </svg>
      </div>

      <svg class="pan" viewBox="0 0 300 360" aria-label="可爱平底锅">
        <defs>
          <linearGradient id="panBody" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#374151"/>
            <stop offset="1" stop-color="#111827"/>
          </linearGradient>
          <radialGradient id="panInner" cx="44%" cy="35%" r="70%">
            <stop offset="0" stop-color="#2f3b51"/>
            <stop offset="1" stop-color="#0f172a"/>
          </radialGradient>
        </defs>
        <rect x="132" y="12" width="36" height="142" rx="18" fill="url(#panBody)"/>
        <circle cx="150" cy="42" r="9" fill="#9ca3af" opacity=".9"/>
        <path d="M124 130h52v42h-52z" fill="#9ca3af"/>
        <circle cx="150" cy="232" r="118" fill="url(#panBody)"/>
        <circle cx="150" cy="232" r="94" fill="url(#panInner)"/>
        <ellipse cx="116" cy="195" rx="36" ry="18" fill="rgba(255,255,255,.08)" transform="rotate(-25 116 195)"/>
        <path d="M108 250c18 22 66 22 84 0" fill="none" stroke="#374151" stroke-width="9" stroke-linecap="round" opacity=".55"/>
        <circle cx="150" cy="232" r="18" fill="#8b1e1e" opacity=".92"/>
        <path d="M144 229c3-5 9-5 12 0 3-5 12-2 12 5 0 10-18 18-18 18s-18-8-18-18c0-7 9-10 12-5z" fill="#ff6b8a"/>
      </svg>
    </section>
  </main>
  <script src="/assets/js/jianbing.js"></script>
</body>
</html>
