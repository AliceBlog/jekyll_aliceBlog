[build]
  command = "hugo --gc --minify && node scripts/hugo-page-compat.js"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.92.1"
  HUGO_ENV = "production"
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
